project_id = "zona"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "zona://auth/callback"
additional_redirect_urls = ["zona://auth/callback", "exp://**"]
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
minimum_password_length = 8

# Hosted Auth (project gerncrjtrdjtjvybvseb) is configured via Management API to
# match these product settings. OAuth Apple/Google need provider credentials
# before they can be enabled; GitHub is already configured on the hosted project.
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[auth.external.github]
enabled = true
# client_id / secret live only in the hosted project (never commit them)

[functions.create-source]
verify_jwt = false

[functions.manage-source]
verify_jwt = false

[functions.create-source-key]
verify_jwt = false

[functions.manage-source-key]
verify_jwt = false

[functions.register-push-token]
verify_jwt = false

[functions.notify]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.cleanup-expired]
verify_jwt = false

[functions.push-delivery-worker]
verify_jwt = false

[functions.reauthenticate]
verify_jwt = false

[functions.account-security]
verify_jwt = false

[functions.account-transfer]
verify_jwt = false

[functions.auth-transaction]
verify_jwt = false

[functions.test-source]
verify_jwt = false

[functions.daily-stats-report]
verify_jwt = false
