openapi: 3.1.0
info:
  title: Zona Edge Function API
  version: 1.1.0
  summary: Source notification ingestion and authenticated mobile operations.
  description: |
    Zona's version 1 HTTP contract. All traffic uses TLS. Sender applications
    normally use only `POST /functions/v1/notify`; the other operations are
    invoked by the authenticated iOS or Android app. Account lifecycle
    operations outside this sender-and-delivery surface are documented in
    `ACCOUNT_MANAGEMENT.md`; this file is not an inventory of every internal
    account handler.

    A 202 response from `notify` means the durable, retention-bounded inbox
    record exists. `pushQueued` counts durable delivery jobs and can be zero
    when account or source quiet hours are active. A background worker sends
    queued jobs with bounded retries and checks Expo receipts; neither a queue
    entry nor a provider receipt proves that the phone displayed an alert.

    Every JSON request has a 16 KiB transport limit. `notify.data` has an
    additional 4 KiB UTF-8 serialized limit. These byte limits are normative
    even where JSON Schema cannot express serialized byte size.
  license:
    name: Proprietary; private project
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{projectRef}.supabase.co
    description: Supabase project
    variables:
      projectRef:
        default: gerncrjtrdjtjvybvseb
        description: Supabase project reference.
tags:
  - name: Sender
    description: Operations authenticated by an independent source credential.
  - name: Mobile
    description: Operations authenticated by a Supabase user access token.
paths:
  /functions/v1/notify:
    post:
      operationId: notify
      tags: [Sender]
      summary: Accept a notification from the authenticated source.
      description: |
        The source and owner are derived from the Bearer credential. Callers
        cannot provide or override source/owner identity. The inbox record and
        eligible delivery jobs are durable before the response is returned.
        Quiet hours suppress only those jobs; the inbox record is still
        accepted and returned normally.

        `Idempotency-Key` is required. Re-sending the same key with an
        identical payload returns the stored notification with
        `idempotentReplay: true` and does not create a duplicate or retry
        push. Reusing the key with a different payload is rejected with
        `409 IDEMPOTENCY_CONFLICT`. Optional severity is part of that payload,
        so changing only severity is also a conflict.

        One evidence image (PNG/JPEG/WebP, up to the account's server-resolved
        attachment limit) may be attached by
        sending `multipart/form-data` with an `attachment` file part. The
        image's SHA-256 participates in idempotency: the same key with a
        different image is a conflict.
      security:
        - sourceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyRequest'
            examples:
              buildComplete:
                value:
                  title: Build complete
                  body: The release build finished successfully.
                  category: build
                  severity: high
                  data:
                    eventId: build-2026-07-20-14
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotifyMultipartRequest'
            encoding:
              data:
                contentType: application/json
              attachment:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: |
            Idempotent replay: this source already sent the same
            `Idempotency-Key` with an identical payload. The stored
            notification is returned; no duplicate is created and push is not
            re-attempted.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyAccepted'
        '202':
          description: |
            Inbox record accepted. Eligible push delivery jobs are durably
            queued, or intentionally omitted while quiet hours are active.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyAccepted'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/InvalidSourceToken'
        '403':
          description: A server control currently rejects this optional capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                attachmentsDisabled:
                  value:
                    error: ATTACHMENTS_DISABLED
                criticalSeverityDisabled:
                  value:
                    error: CRITICAL_SEVERITY_DISABLED
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The `Idempotency-Key` was already used by this source with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: IDEMPOTENCY_CONFLICT
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '429':
          description: Rate limit exceeded; currently 60 accepted requests per source or 20 per standard account in the rolling minute. Operator-configured plan limits may be lower or higher where documented.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: integer
                minimum: 1
              example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sourceLimited:
                  value:
                    error: RATE_LIMITED
                accountLimited:
                  value:
                    error: ACCOUNT_RATE_LIMITED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /functions/v1/create-source:
    post:
      operationId: createSource
      tags: [Mobile]
      summary: Create a source and return its credential once.
      description: |
        The credential is never retrievable again. The response uses
        `Cache-Control: no-store`; the client must move the token to the
        sender's OS-backed secret store.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSource'
        '400':
          description: Source name/hostname or request JSON is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INVALID_SOURCE
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The account reached its active-source plan limit (3 for the standard plan by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SOURCE_LIMIT_REACHED
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '429':
          description: Source creation exceeded 10 requests per account per hour.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: integer
                minimum: 1
              example: 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: CREATE_RATE_LIMITED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /functions/v1/create-source-key:
    post:
      operationId: createSourceAccessKey
      tags: [Mobile]
      summary: Issue one additional access key for an owned source.
      description: |
        The permanent source identity is unchanged. The plaintext credential is
        returned once with `Cache-Control: no-store`; only its hash is stored.
        Test a replacement key before permanently revoking the old one.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceKeyRequest'
      responses:
        '201':
          description: Access key created.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSourceKey'
        '400':
          description: Source ID, key label, or request JSON is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INVALID_SOURCE_KEY
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '404':
          description: Source is absent, revoked, or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SOURCE_NOT_FOUND
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The source or account reached its unrevoked access-key limit (10 per source and 10 per standard account by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sourceLimit:
                  value:
                    error: SOURCE_KEY_LIMIT_REACHED
                accountLimit:
                  value:
                    error: ACCESS_KEY_LIMIT_REACHED
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '429':
          description: Access-key creation exceeded 30 requests per account per hour.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: integer
                minimum: 1
              example: 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: CREATE_RATE_LIMITED
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /functions/v1/manage-source-key:
    post:
      operationId: manageSourceAccessKey
      tags: [Mobile]
      summary: Rename, pause/resume, or revoke one owned access key.
      description: |
        The action affects only the selected key. Pausing is reversible;
        revocation is permanent. Sibling keys and the source remain unchanged.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSourceKeyRequest'
      responses:
        '200':
          description: Requested key action completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSourceKey'
        '400':
          description: Access-key ID, action, label, active state, or request JSON is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '404':
          description: Access key is absent or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SOURCE_KEY_NOT_FOUND
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '500':
          $ref: '#/components/responses/InternalError'

  /functions/v1/manage-source:
    post:
      operationId: manageSource
      tags: [Mobile]
      summary: Rename or apply an aggregate pause/resume/revoke to an owned source.
      description: |
        Compatibility endpoint for older Zona builds. Pause/resume and revoke
        intentionally apply to every unrevoked access key under the source.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSourceRequest'
      responses:
        '200':
          description: Requested source action completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSource'
        '400':
          description: Invalid action, source UUID, display name, or JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidAction:
                  value:
                    error: INVALID_ACTION
                invalidSource:
                  value:
                    error: INVALID_SOURCE
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '404':
          description: Source is absent, revoked, or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SOURCE_NOT_FOUND
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '500':
          $ref: '#/components/responses/InternalError'

  /functions/v1/test-source:
    post:
      operationId: testSource
      tags: [Mobile]
      summary: Create and queue a test alert for one owned source.
      description: |
        Creates the durable inbox record and uses the same delivery queue,
        quiet-schedule, preview, sound, retry, and receipt behavior as sender
        `notify`. The source must be active and owned by the user.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSourceRequest'
      responses:
        '202':
          description: Test inbox record created; eligible delivery jobs were queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSourceAccepted'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '404':
          description: Source is absent or not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Source API key is paused, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /functions/v1/register-push-token:
    post:
      operationId: managePushRegistration
      tags: [Mobile]
      summary: Register or remove one iOS or Android installation.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRegistrationRequest'
      responses:
        '200':
          description: Registration action completed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PushRegistered'
                  - $ref: '#/components/schemas/PushUnregistered'
        '400':
          description: Invalid action, platform, installation ID, push token, or JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidDevice:
                  value:
                    error: INVALID_DEVICE
                invalidAction:
                  value:
                    error: INVALID_ACTION
        '401':
          $ref: '#/components/responses/UnauthorizedUser'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Push token/installation ownership conflicts, or the account reached its plan-resolved active-device limit (10 standard, 25 premium by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenConflict:
                  value:
                    error: TOKEN_CONFLICT
                installationConflict:
                  value:
                    error: INSTALLATION_CONFLICT
                deviceLimit:
                  value:
                    error: DEVICE_LIMIT_REACHED
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountInactive'
        '429':
          description: Device registration exceeded 120 requests per account per hour.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: integer
                minimum: 1
              example: 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: DEVICE_RATE_LIMITED
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/rpc/get_notification_delivery_summary:
    post:
      operationId: getNotificationDeliverySummary
      tags: [Mobile]
      summary: Read a safe delivery summary for one owned notification.
      description: |
        This mobile-only RPC aggregates the private per-phone delivery queue.
        It never returns push tokens, Expo ticket IDs, worker leases, raw
        provider errors, or another owner's state. `sent` means at least one
        push receipt confirms APNs or FCM accepted the notification; it does
        not prove that the phone displayed it.
      security:
        - userBearer: []
          publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverySummaryRequest'
      responses:
        '200':
          description: Owner-scoped delivery summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeliverySummary'
        '400':
          description: Notification is missing, expired, or belongs to another owner.
        '401':
          $ref: '#/components/responses/UnauthorizedUser'

components:
  securitySchemes:
    sourceBearer:
      type: http
      scheme: bearer
      bearerFormat: zona_live_SOURCE_TOKEN
      description: Independent one-time-issued source credential.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase access JWT
      description: Current Supabase Auth access token for the owner.
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase publishable project key required by the Data API gateway.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sender-chosen unique event ID. Replays with an identical payload
        return the original notification; reuse with a different payload is
        rejected with `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
      example: build-2026-07-20-14

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    DeliverySummaryRequest:
      type: object
      additionalProperties: false
      required: [p_notification_id]
      properties:
        p_notification_id:
          type: string
          format: uuid

    NotificationDeliverySummary:
      type: object
      additionalProperties: false
      required: [state, targetedPhones, providerAccepted, failed, pending, updatedAt, reason]
      properties:
        state:
          type: string
          enum: [not_sent, queued, sent, needs_attention]
        targetedPhones:
          type: integer
          minimum: 0
        providerAccepted:
          type: integer
          minimum: 0
          description: Provider-receipt successes, not proof of display on a phone.
        failed:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        reason:
          type: [string, 'null']
          enum: [device_unavailable, message_too_big, push_configuration, provider_unavailable, unconfirmed, quiet_hours, null]

    NotifyRequest:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Whitespace-trimmed title.
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Whitespace-trimmed message.
        category:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
        severity:
          type: [string, 'null']
          enum: [low, medium, high, critical, null]
          description: Optional visual urgency. Null or omitted uses the active theme's neutral inbox style.
        data:
          type: object
          description: |
            JSON object no more than 4096 UTF-8 bytes when serialized. Reserved
            routing fields in the produced push are controlled by the server.
          additionalProperties: true

    NotifyAccepted:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - sourceId
        - sourceName
        - acceptedAt
        - idempotentReplay
        - attachmentAccepted
        - attachmentError
        - pushAttempted
        - pushAccepted
      properties:
        notificationId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        sourceName:
          type: string
          minLength: 1
          maxLength: 80
        acceptedAt:
          type: string
          format: date-time
        idempotentReplay:
          type: boolean
          description: True when an existing record was replayed instead of newly accepted.
        attachmentAccepted:
          type: boolean
          description: True when an evidence image is stored for this notification.
        attachmentError:
          type: [string, 'null']
          description: Sanitized failure code (UPLOAD_FAILED) when a sent image was not stored.
        pushAttempted:
          type: integer
          minimum: 0
          description: |
            Compatibility alias. For a newly accepted notification this equals
            `pushQueued`; for an idempotent replay it is zero. It does not mean
            that an Expo request has already run.
        pushAccepted:
          type: integer
          minimum: 0
          description: |
            Compatibility field retained for older clients. `notify` returns
            zero because Expo ticket and receipt processing is asynchronous.
        pushQueued:
          type: integer
          minimum: 0
          description: |
            Durable delivery jobs created for eligible phones. This is zero
            while account or source quiet hours are active. Present on a newly
            accepted notification and omitted on an idempotent replay.

    NotifyMultipartRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Whitespace-trimmed title.
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Whitespace-trimmed message.
        category:
          type: string
          minLength: 1
          maxLength: 80
        severity:
          type: string
          enum: [low, medium, high, critical]
        data:
          type: string
          description: JSON-encoded object, at most 4096 UTF-8 bytes when serialized.
        attachment:
          type: string
          format: binary
          description: |
            Optional evidence image, up to the server-resolved account limit
            (5 MiB for the standard plan by default). Only magic bytes are
            trusted: PNG, JPEG, and WebP are accepted; anything else (including
            SVG and renamed executables) is rejected with `INVALID_PAYLOAD`.
            The whole multipart request is limited to the attachment limit
            plus 1 MiB of form overhead.

    CreateSourceRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        hostname:
          type: [string, 'null']
          minLength: 1
          maxLength: 255

    CreatedSource:
      type: object
      additionalProperties: false
      required: [sourceId, accessKeyId, displayName, hostname, keyLabel, token, ingestUrl]
      properties:
        sourceId:
          type: string
          format: uuid
        accessKeyId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        hostname:
          type: [string, 'null']
          maxLength: 255
        keyLabel:
          type: string
          minLength: 1
          maxLength: 80
        token:
          type: string
          pattern: '^zona_live_[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Returned once; move immediately to secure sender storage.
        ingestUrl:
          type: string
          format: uri

    CreateSourceKeyRequest:
      type: object
      additionalProperties: false
      required: [sourceId, keyLabel]
      properties:
        sourceId:
          type: string
          format: uuid
        keyLabel:
          type: string
          minLength: 1
          maxLength: 80

    CreatedSourceKey:
      type: object
      additionalProperties: false
      required: [sourceId, accessKeyId, keyLabel, token, ingestUrl]
      properties:
        sourceId:
          type: string
          format: uuid
        accessKeyId:
          type: string
          format: uuid
        keyLabel:
          type: string
          minLength: 1
          maxLength: 80
        token:
          type: string
          pattern: '^zona_live_[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Returned once; move immediately to secure sender storage.
        ingestUrl:
          type: string
          format: uri

    RenameSourceKeyRequest:
      type: object
      additionalProperties: false
      required: [action, accessKeyId, keyLabel]
      properties:
        action:
          type: string
          const: rename
        accessKeyId:
          type: string
          format: uuid
        keyLabel:
          type: string
          minLength: 1
          maxLength: 80

    RevokeSourceKeyRequest:
      type: object
      additionalProperties: false
      required: [action, accessKeyId]
      properties:
        action:
          type: string
          const: revoke
        accessKeyId:
          type: string
          format: uuid

    SetSourceKeyActiveRequest:
      type: object
      additionalProperties: false
      required: [action, accessKeyId, isActive]
      properties:
        action:
          type: string
          const: set_active
        accessKeyId:
          type: string
          format: uuid
        isActive:
          type: boolean

    ManageSourceKeyRequest:
      oneOf:
        - $ref: '#/components/schemas/RenameSourceKeyRequest'
        - $ref: '#/components/schemas/RevokeSourceKeyRequest'
        - $ref: '#/components/schemas/SetSourceKeyActiveRequest'
      discriminator:
        propertyName: action
        mapping:
          rename: '#/components/schemas/RenameSourceKeyRequest'
          revoke: '#/components/schemas/RevokeSourceKeyRequest'
          set_active: '#/components/schemas/SetSourceKeyActiveRequest'

    ManagedSourceKey:
      type: object
      additionalProperties: false
      required: [sourceId, accessKeyId, keyLabel, isActive, revokedAt]
      properties:
        sourceId:
          type: string
          format: uuid
        accessKeyId:
          type: string
          format: uuid
        keyLabel:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
        revokedAt:
          type: [string, 'null']
          format: date-time

    RenameSourceRequest:
      type: object
      additionalProperties: false
      required: [action, sourceId, displayName]
      properties:
        action:
          type: string
          const: rename
        sourceId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    RevokeSourceRequest:
      type: object
      additionalProperties: false
      required: [action, sourceId]
      properties:
        action:
          type: string
          const: revoke
        sourceId:
          type: string
          format: uuid

    SetSourceActiveRequest:
      type: object
      additionalProperties: false
      required: [action, sourceId, isActive]
      properties:
        action:
          type: string
          const: set_active
        sourceId:
          type: string
          format: uuid
        isActive:
          type: boolean

    ManageSourceRequest:
      oneOf:
        - $ref: '#/components/schemas/RenameSourceRequest'
        - $ref: '#/components/schemas/RevokeSourceRequest'
        - $ref: '#/components/schemas/SetSourceActiveRequest'
      discriminator:
        propertyName: action
        mapping:
          rename: '#/components/schemas/RenameSourceRequest'
          revoke: '#/components/schemas/RevokeSourceRequest'
          set_active: '#/components/schemas/SetSourceActiveRequest'

    ManagedSource:
      type: object
      additionalProperties: false
      required: [sourceId, apiKeyId, displayName, isActive, revokedAt]
      properties:
        sourceId:
          type: string
          format: uuid
        apiKeyId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
        revokedAt:
          type: [string, 'null']
          format: date-time

    TestSourceRequest:
      type: object
      additionalProperties: false
      required: [sourceId]
      properties:
        sourceId:
          type: string
          format: uuid

    TestSourceAccepted:
      type: object
      additionalProperties: false
      required: [notificationId, sourceId, pushQueued, pushAttempted, pushAccepted]
      properties:
        notificationId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        pushQueued:
          type: integer
          minimum: 0
          description: Durable delivery jobs created for eligible phones.
        pushAttempted:
          type: integer
          minimum: 0
          deprecated: true
          description: Compatibility alias equal to `pushQueued`; no provider request has run yet.
        pushAccepted:
          type: integer
          minimum: 0
          deprecated: true
          description: Compatibility field; always zero because delivery is asynchronous.

    RegisterPushRequest:
      type: object
      additionalProperties: false
      required: [action, token, deviceId, platform]
      properties:
        action:
          type: string
          const: register
        token:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(Expo|Exponent)PushToken\[[A-Za-z0-9_-]+\]$'
        deviceId:
          type: string
          minLength: 8
          maxLength: 200
        platform:
          type: string
          enum: [ios, android]

    UnregisterPushRequest:
      type: object
      additionalProperties: false
      required: [action, deviceId]
      properties:
        action:
          type: string
          const: unregister
        deviceId:
          type: string
          minLength: 8
          maxLength: 200

    PushRegistrationRequest:
      oneOf:
        - $ref: '#/components/schemas/RegisterPushRequest'
        - $ref: '#/components/schemas/UnregisterPushRequest'
      discriminator:
        propertyName: action
        mapping:
          register: '#/components/schemas/RegisterPushRequest'
          unregister: '#/components/schemas/UnregisterPushRequest'

    PushRegistered:
      type: object
      additionalProperties: false
      required: [registered]
      properties:
        registered:
          type: boolean
          const: true

    PushUnregistered:
      type: object
      additionalProperties: false
      required: [unregistered]
      properties:
        unregistered:
          type: boolean
          const: true

  responses:
    InvalidPayload:
      description: Invalid JSON, content type, field, or size-constrained value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPayload:
              value:
                error: INVALID_PAYLOAD
            invalidIdempotencyKey:
              value:
                error: INVALID_IDEMPOTENCY_KEY
    InvalidSourceToken:
      description: Source token is absent, malformed, unknown, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_TOKEN
    UnauthorizedUser:
      description: Supabase user access token is absent, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
    AccountInactive:
      description: The owning account is deleted, deleting, suspended, or otherwise inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ACCOUNT_INACTIVE
    MethodNotAllowed:
      description: Endpoint accepts POST only, except for CORS preflight.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: METHOD_NOT_ALLOWED
    PayloadTooLarge:
      description: Request body exceeds 16 KiB (JSON) or the plan-resolved attachment limit plus 1 MiB (multipart).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: PAYLOAD_TOO_LARGE
    InternalError:
      description: Request was not accepted or the management operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL_ERROR
    ServiceUnavailable:
      description: A fail-closed operator switch temporarily paused this operation.
      headers:
        Retry-After:
          description: Minimum retry delay in seconds.
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SERVICE_UNAVAILABLE
