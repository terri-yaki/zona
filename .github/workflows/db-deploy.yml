name: Deploy DB

# Manually applies reviewed pending Supabase migrations to the live project.
# CI validates migrations on pull requests and main; production deployment is a
# separate operator decision so a documentation or branch merge cannot mutate
# the database automatically.

on:
  workflow_dispatch:

permissions:
  contents: read

# Migrations must never be cancelled mid-flight, and two pushes must not
# race each other.
concurrency:
  group: db-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: gerncrjtrdjtjvybvseb
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN."
            echo "Create one at https://supabase.com/dashboard/account/tokens"
            echo "then add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD."
            echo "The database password from project creation (resettable in"
            echo "Dashboard → Project Settings → Database), added under"
            echo "GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list
          supabase db push
